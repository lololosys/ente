[project]
name = "ente-finder"
version = "0.1.0"
description = "Find-me, search and folders for one shared Ente album"
requires-python = ">=3.12"
dependencies = [
    "pynacl>=1.5",
    "base58>=2.1",
    "httpx>=0.27",
    "numpy>=2.0",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.20",
    "regex>=2024.0",
    "ftfy>=6.2",
    "starlette>=0.40",
    "python-multipart>=0.0.18",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
